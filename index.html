<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1C2B39">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Khata">
<title>Khata — your money, plainly kept</title>
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231C2B39'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle' fill='%23C99A3D' font-family='Georgia,serif'%3E৳%3C/text%3E%3C/svg%3E">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --paper:#FAF6EF;
    --paper-raised:#FFFFFF;
    --ink:#1C2B39;
    --ink-soft:#435362;
    --ink-faint:#556677;
    --teal:#2F6F5E;
    --teal-soft:#E7EFEB;
    --rust:#B54834;
    --rust-soft:#F5E9E5;
    --gold:#C08A2E;
    --gold-soft:#F6EEDD;
    --line:#E6DFCF;
    --blue:#2B6CB0;
    --blue-soft:#EBF8FF;
    --purple:#6B46C1;
    --purple-soft:#FAF5FF;
    --radius-card:18px;
    --radius-sheet:22px;
    --font-display:'Fraunces',serif;
    --font-ui:'Inter',sans-serif;
  }
  /* Mode 2: Classic Navy Dark Theme */
  body.theme-dark{
    --paper:#0f1720;
    --paper-raised:#18222d;
    --ink:#F3F6FA;
    --ink-soft:#CBD5E1;
    --ink-faint:#94A3B8;
    --teal:#43C39E;
    --teal-soft:#17332B;
    --rust:#FF6B52;
    --rust-soft:#3C1F1A;
    --gold:#F5B742;
    --gold-soft:#3D2F14;
    --blue:#63B3ED;
    --blue-soft:#1A365D;
    --purple:#B794F4;
    --purple-soft:#322659;
    --line:#26374a;
  }
  /* Mode 3: Solid True AMOLED Pitch-Black Theme */
  body.theme-amoled{
    --paper:#000000;
    --paper-raised:#121212;
    --ink:#FFFFFF;
    --ink-soft:#B4B4B8;
    --ink-faint:#8E8E93;
    --teal:#34D399;
    --teal-soft:#072418;
    --rust:#F87171;
    --rust-soft:#2D0F0B;
    --gold:#FBBF24;
    --gold-soft:#2B1E05;
    --blue:#60A5FA;
    --blue-soft:#0E1F3B;
    --purple:#C084FC;
    --purple-soft:#240F3E;
    --line:#222222;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:#DCD3BE;
    font-family:var(--font-ui);
    color:var(--ink);
    display:flex;
    justify-content:center;
    min-height:100vh;
  }
  body.theme-dark{background:#070b10;}
  body.theme-amoled{background:#000000;}
  .app-shell{
    width:100%;
    max-width:460px;
    min-height:100vh;
    background:var(--paper);
    position:relative;
    display:flex;
    flex-direction:column;
    box-shadow:0 0 40px rgba(0,0,0,.15);
    overflow-x:hidden;
  }
  body.theme-dark .app-shell{
    box-shadow:0 0 40px rgba(0,0,0,.6);
  }
  body.theme-amoled .app-shell{
    background:#000000;
    box-shadow:0 0 50px rgba(0,0,0,.85);
  }
  ::selection{background:var(--gold-soft);}
  .tabular{font-variant-numeric:tabular-nums;}

  header.top{
    padding:22px 20px 14px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-shrink:0;
  }
  header.top .brand{
    font-family:var(--font-display);
    font-weight:600;
    font-size:22px;
    letter-spacing:.2px;
  }
  header.top .brand span{color:var(--gold);}
  header.top .tagline{
    font-size:11.5px;
    color:var(--ink-faint);
    font-weight:500;
  }

  #content{
    flex:1;
    overflow-y:auto;
    padding:0 20px 110px;
    -webkit-overflow-scrolling:touch;
  }

  /* Aesthetic Vintage Ledger Hero Card */
  .hero{
    background: linear-gradient(135deg, #1C2B39 0%, #101B26 100%);
    color: #FFFFFF;
    border-radius: 20px;
    padding: 22px 18px;
    margin-bottom: 18px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  body.theme-dark .hero{
    background: linear-gradient(135deg, #1A2836 0%, #111A23 100%);
    border: 1px solid #2a3d52;
    box-shadow: 0 8px 26px rgba(0, 0, 0, 0.4);
  }
  body.theme-amoled .hero{
    background: linear-gradient(145deg, #151515 0%, #090909 100%);
    border: 1px solid #252525;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
  }
  .hero .label{
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: #9DB2C6;
    margin-bottom: 4px;
  }
  body.theme-dark .hero .label{color: #94A3B8;}
  body.theme-amoled .hero .label{color: #8C8C94;}
  .hero .balance{
    font-family: var(--font-display); /* Classic aesthetic serif numbers */
    font-size: 38px;
    font-weight: 600;
    letter-spacing: -0.3px;
    line-height: 1.15;
    margin-bottom: 16px;
    color: #FFFFFF;
    text-shadow: 0 2px 12px rgba(0,0,0,.35);
  }
  .hero .row{
    display: grid;
    grid-template-columns: 1.15fr 1fr 1fr;
    gap: 8px;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
    padding-top: 14px;
  }
  .hero .row .item{
    background: rgba(255, 255, 255, 0.06);
    padding: 10px 6px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    text-align: center;
  }
  body.theme-dark .hero .row .item{
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  body.theme-amoled .hero .row .item{
    background: #111111;
    border: 1px solid #222222;
  }
  .hero .row .item .k{
    font-size: 11px;
    font-weight: 600;
    color: #A6B9CC;
    margin-bottom: 4px;
  }
  body.theme-dark .hero .row .item .k{color: #A0B3C6;}
  body.theme-amoled .hero .row .item .k{color: #909096;}
  .hero .row .item .v{
    font-family: var(--font-display); /* Classic aesthetic serif numbers */
    font-size: 16.5px;
    font-weight: 600;
  }
  .hero .row .item.cash .v{color: #FFFFFF;}
  .hero .row .item.in .v{color: #4ADE80;}
  .hero .row .item.out .v{color: #FB7185;}

  /* AR & AP Summary Badge in Home */
  .debt-summary-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:18px;
  }
  .debt-pill{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
    display:flex;
    flex-direction:column;
    gap:4px;
    cursor:pointer;
  }
  body.theme-dark .debt-pill{
    background:#18222d;
    border:1px solid #26374a;
  }
  body.theme-amoled .debt-pill{
    background:#121212;
    border:1px solid #222222;
  }
  .debt-pill .label{
    font-size:11.5px;
    font-weight:700;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:5px;
  }
  body.theme-dark .debt-pill .label{color:#CBD5E1;}
  body.theme-amoled .debt-pill .label{color:#B8B8BD;}
  .debt-pill .val{
    font-family:var(--font-display);
    font-size:17.5px;
    font-weight:600;
  }
  .debt-pill.ar .val{color:var(--teal);}
  body.dark-mode .debt-pill.ar .val{color:#38BDF8;}
  .debt-pill.ap .val{color:var(--rust);}
  body.dark-mode .debt-pill.ap .val{color:#F87171;}

  .quick{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:12px;
  }
  .quick-extra{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:22px;
  }
  .quick button, .quick-extra button{
    font-family:var(--font-ui);
    font-size:13px;
    font-weight:600;
    padding:11px 6px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--paper-raised);
    color:var(--ink);
    cursor:pointer;
  }
  body.dark-mode .quick button, body.dark-mode .quick-extra button{
    background:var(--paper-raised);
    border:1px solid var(--line);
    color:var(--ink);
  }
  .quick button:active, .quick-extra button:active{transform:scale(.97);}
  .quick button.income{color:var(--teal);}
  body.dark-mode .quick button.income{color:#34D399;}
  .quick button.expense{color:var(--rust);}
  body.dark-mode .quick button.expense{color:#F87171;}
  .quick button.transfer{color:var(--gold);}
  body.dark-mode .quick button.transfer{color:#FBBF24;}
  .quick-extra button.lend{color:var(--blue); border-color:rgba(43,108,176,0.3);}
  body.dark-mode .quick-extra button.lend{color:#60A5FA; border-color:#20324E;}
  .quick-extra button.borrow{color:var(--purple); border-color:rgba(107,70,193,0.3);}
  body.dark-mode .quick-extra button.borrow{color:#C084FC; border-color:#351B55;}

  /* Recurring bills reminder card */
  .reminder{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius-card);
    padding:16px 18px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.03);
  }
  body.theme-dark .reminder{
    border:1px solid #26374a;
    background:#18222d;
  }
  body.theme-amoled .reminder{
    border:1px solid #222222;
    background:#121212;
  }
  .reminder .h{
    font-family:var(--font-display);
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  body.dark-mode .reminder .h{color:#FFFFFF;}
  .reminder .line{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    padding:11px 0;
    border-top:1px solid var(--line);
  }
  body.theme-dark .reminder .line{border-top:1px solid #243447;}
  body.theme-amoled .reminder .line{border-top:1px solid #1f1f1f;}
  .reminder .line:first-of-type{border-top:none; padding-top:2px;}
  .reminder .line:last-child{padding-bottom:2px;}
  .reminder .line .bill-info{
    display:flex;
    flex-direction:column;
    gap:3px;
    min-width:0;
    flex:1;
  }
  .reminder .line .bill-name{
    font-size:14.5px;
    font-weight:600;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  body.dark-mode .reminder .line .bill-name{color:#FFFFFF;}
  .reminder .line .bill-sub{
    font-size:12px;
    color:var(--ink-faint);
    font-weight:500;
  }
  .reminder .line .bill-amt{
    font-family:var(--font-display);
    font-size:16px;
    font-weight:600;
    color:var(--rust);
    white-space:nowrap;
    text-align:right;
  }

  .sec-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:22px 0 10px;
  }
  .sec-head h3{
    font-family:var(--font-display);
    font-size:16px;
    font-weight:600;
    margin:0;
  }
  .sec-head a{
    font-size:12px;
    color:var(--ink-soft);
    text-decoration:none;
    cursor:pointer;
  }

  .tx-list{border-top:1px solid var(--line);}
  .tx{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .tx .dot{
    width:38px;height:38px;flex-shrink:0;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
    background:var(--teal-soft); color:var(--teal);
  }
  .tx.expense .dot{background:var(--rust-soft); color:var(--rust);}
  .tx.transfer .dot{background:var(--gold-soft); color:var(--gold);}
  .tx.lend .dot{background:var(--blue-soft); color:var(--blue);}
  .tx.borrow .dot{background:var(--purple-soft); color:var(--purple);}
  .tx .mid{flex:1; min-width:0;}
  .tx .mid .t1{font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tx .mid .t2{font-size:12px; color:var(--ink-faint); margin-top:2px; font-weight:500;}
  .tx .amt{font-family:var(--font-display); font-weight:600; font-size:15px; white-space:nowrap;}
  .tx.income .amt{color:var(--teal);}
  .tx.expense .amt{color:var(--rust);}
  .tx.transfer .amt{color:var(--gold);}
  .tx.lend .amt{color:var(--blue);}
  .tx.borrow .amt{color:var(--purple);}

  .debt-card-row{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  body.theme-dark .debt-card-row{
    background:#18222d;
    border:1px solid #26374a;
  }
  body.theme-amoled .debt-card-row{
    background:#121212;
    border:1px solid #222222;
  }
  .debt-card-row.settled{opacity:0.6;}
  .debt-card-row .p-name{font-weight:700; font-size:14.5px; margin-bottom:2px;}
  body.dark-mode .debt-card-row .p-name{color:#FFFFFF;}
  .debt-card-row .p-sub{font-size:11.5px; color:var(--ink-faint); font-weight:500;}
  .debt-card-row .right-side{text-align:right;}
  .debt-card-row .p-amt{font-family:var(--font-display); font-weight:600; font-size:16px;}
  .debt-card-row .settle-btn{
    margin-top:4px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:5px 12px;
    border-radius:8px;
    font-size:11.5px;
    font-weight:700;
    cursor:pointer;
  }
  body.dark-mode .debt-card-row .settle-btn{background:var(--gold); color:#111111;}

  .empty{
    text-align:center;
    padding:34px 10px;
    color:var(--ink-faint);
    font-size:13px;
  }
  .empty .big{font-family:var(--font-display); font-size:15px; color:var(--ink-soft); margin-bottom:4px;}

  .acc-grid{display:flex; flex-direction:column; gap:10px; margin-bottom:10px;}
  .acc-card{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
  }
  body.theme-dark .acc-card{
    background:#18222d;
    border:1px solid #26374a;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
  }
  body.theme-amoled .acc-card{
    background:#121212;
    border:1px solid #222222;
    box-shadow:0 2px 8px rgba(0,0,0,0.4);
  }
  .acc-card .name{font-size:14px; font-weight:600;}
  body.dark-mode .acc-card .name{color:#FFFFFF;}
  .acc-card .bal{font-family:var(--font-display); font-size:17.5px; font-weight:600;}
  body.dark-mode .acc-card .bal{color:#FFFFFF;}

  .acc-total{
    background:var(--ink); color:var(--paper);
    border-radius:14px; padding:16px;
    display:flex; justify-content:space-between; align-items:center;
    margin-top:4px;
  }
  body.theme-dark .acc-total{
    background:linear-gradient(135deg, #1C2B39 0%, #131E29 100%);
    color:#FFFFFF;
    border:1px solid var(--gold);
    box-shadow:0 4px 14px rgba(0,0,0,0.35);
  }
  body.theme-amoled .acc-total{
    background:linear-gradient(135deg, #181818 0%, #0d0d0d 100%);
    color:#FFFFFF;
    border:1px solid var(--gold);
    box-shadow:0 4px 14px rgba(0,0,0,0.5);
  }
  .acc-total .name{font-size:13px; color:rgba(255,255,255,0.85); font-weight:600;}
  body.theme-dark .acc-total .name{color:#CBD5E1; font-weight:600;}
  body.theme-amoled .acc-total .name{color:#B8B8BD; font-weight:600;}
  .acc-total .bal{font-family:var(--font-display); font-size:20px; font-weight:700;}
  body.dark-mode .acc-total .bal{color:var(--gold);}

  label.field{display:block; margin-bottom:16px;}
  label.field .fl{font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; display:block;}
  .field input, .field select, .field textarea{
    width:100%;
    font-family:var(--font-ui);
    font-size:15px;
    padding:12px 13px;
    border-radius:11px;
    border:1px solid var(--line);
    background:var(--paper-raised);
    color:var(--ink);
    appearance:none;
  }
  body.dark-mode .field input, body.dark-mode .field select, body.dark-mode .field textarea{
    background:var(--paper-raised);
    border-color:var(--line);
    color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--gold); outline-offset:1px;
  }
  .amount-input{position:relative;}
  .amount-input .sym{
    position:absolute; left:13px; top:50%; transform:translateY(-50%);
    font-family:var(--font-display); font-weight:600; color:var(--ink-soft);
    pointer-events:none;
  }
  .amount-input input{padding-left:30px; font-family:var(--font-display); font-weight:600; font-size:20px;}

  .segmented{
    display:flex;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    padding:3px;
    margin-bottom:20px;
    overflow-x:auto;
  }
  body.theme-dark .segmented{background:#0b121a; border-color:#26374a;}
  body.theme-amoled .segmented{background:#0e0e0e; border-color:#222222;}
  .segmented button{
    flex:1;
    border:none;
    background:transparent;
    padding:9px 4px;
    font-family:var(--font-ui);
    font-weight:600;
    font-size:12px;
    color:var(--ink-soft);
    border-radius:9px;
    cursor:pointer;
    white-space:nowrap;
  }
  .segmented button.active{background:var(--ink); color:var(--paper);}
  body.theme-dark .segmented button.active{background:#26374a; color:#FFFFFF; border:1px solid #364b63;}
  body.theme-amoled .segmented button.active{background:#222222; color:#FFFFFF; border:1px solid #333333;}

  /* 3-Way Theme Segmented Control */
  .theme-segmented{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
  }
  .theme-segmented button{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    padding:11px 4px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:var(--paper-raised);
    color:var(--ink-soft);
    font-family:var(--font-ui);
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    transition:all .18s ease;
  }
  .theme-segmented button.active{
    border-color:var(--gold);
    color:var(--ink);
    background:var(--gold-soft);
  }
  body.theme-dark .theme-segmented button.active{
    background:#203144;
    color:#FFFFFF;
  }
  body.theme-amoled .theme-segmented button.active{
    background:#1c1c1c;
    color:#FFFFFF;
  }
  .theme-dot{
    width:18px; height:18px;
    border-radius:50%;
    display:inline-block;
  }
  .normal-dot{
    background:#FAF6EF;
    border:1.5px solid #1C2B39;
  }
  .dark-dot{
    background:#0f1720;
    border:1.5px solid #63B3ED;
  }
  .amoled-dot{
    background:#000000;
    border:1.5px solid #FBBF24;
  }

  .btn{
    display:block;
    width:100%;
    text-align:center;
    padding:14px;
    border-radius:12px;
    border:none;
    font-family:var(--font-ui);
    font-weight:700;
    font-size:15px;
    cursor:pointer;
  }
  .btn.primary{background:var(--ink); color:var(--paper);}
  body.theme-dark .btn.primary{background:#F3F6FA; color:#0f1720;}
  body.theme-amoled .btn.primary{background:#FFFFFF; color:#000000;}
  .btn.primary:active{opacity:.85;}
  .btn.ghost{background:transparent; color:var(--ink-soft); margin-top:8px;}
  .btn.small{padding:8px 12px; font-size:12.5px; width:auto; border-radius:10px;}
  .btn.outline{
    border:1px solid var(--line);
    background:var(--paper-raised);

<script>
const APP_VERSION = '1.0.0';
const GITHUB_REPO = 'mahfuz-joy/khata';

// Dismiss Cordova splash screen immediately once ready
document.addEventListener('deviceready', () => {
  if (window.navigator && window.navigator.splashscreen && typeof window.navigator.splashscreen.hide === 'function') {
    window.navigator.splashscreen.hide();
  }
}, false);

const DB = {
  get(key, fallback){
    try{ const v = localStorage.getItem('khata_'+key); return v ? JSON.parse(v) : fallback; }
    catch(e){ return fallback; }
  },
  set(key, val){ localStorage.setItem('khata_'+key, JSON.stringify(val)); }
};

const GOOGLE_CLIENT_ID = '341416834173-h5o70osb7v3986bc2oqt9vakblbmcpk1.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
const DRIVE_FILENAME = 'khata-data.json';

let driveTokenClient = null;
let driveAccessToken = null;
let drivePendingAction = null;
let driveAutoSync = DB.get('driveAutoSync', true);
let driveStatus = DB.get('driveStatus', {lastSync:null});

// Theme management: 'normal' | 'dark' | 'amoled'
let currentTheme = DB.get('theme', null);
if (!currentTheme) {
  const legacyDark = DB.get('darkMode', false);
  currentTheme = legacyDark ? 'amoled' : 'normal';
}

function applyTheme(theme){
  document.body.classList.remove('theme-normal', 'theme-dark', 'theme-amoled', 'dark-mode');
  if(theme === 'dark'){
    document.body.classList.add('theme-dark', 'dark-mode');
  } else if(theme === 'amoled'){
    document.body.classList.add('theme-amoled', 'dark-mode');
  } else {
    document.body.classList.add('theme-normal');
  }
  currentTheme = theme;
  DB.set('theme', theme);
  DB.set('darkMode', theme !== 'normal');
}
applyTheme(currentTheme);

function changeTheme(theme){
  applyTheme(theme);
  const label = document.getElementById('themeCurrentLabel');
  if(label) label.textContent = theme === 'normal' ? 'Normal' : theme === 'dark' ? 'Navy Dark' : 'AMOLED';
  const btns = document.querySelectorAll('.theme-segmented button');
  if(btns.length === 3){
    btns[0].classList.toggle('active', theme === 'normal');
    btns[1].classList.toggle('active', theme === 'dark');
    btns[2].classList.toggle('active', theme === 'amoled');
  }
}

function openDevModal(){
  document.getElementById('devModal').classList.add('show');
}
function closeDevModal(){
  document.getElementById('devModal').classList.remove('show');
}

/* App Update & Version Checking */
let isCheckingUpdate = false;
let lastUpdateStatus = null;

function compareVersions(v1, v2) {
  if (!v1 || !v2) return 0;
  const parse = v => String(v).replace(/^v/i, '').trim().split(/[.\-+]/).map(x => parseInt(x, 10) || 0);
  const p1 = parse(v1);
  const p2 = parse(v2);
  const max = Math.max(p1.length, p2.length);
  for (let i = 0; i < max; i++) {
    const a = p1[i] || 0;
    const b = p2[i] || 0;
    if (a > b) return 1;
    if (a < b) return -1;
  }
  return 0;
}

function openDownloadLink(url) {
  if (!url) return;
  if (window.cordova && window.cordova.InAppBrowser) {
    window.cordova.InAppBrowser.open(url, '_system');
  } else {
    window.open(url, '_blank', 'noopener,noreferrer');
  }
}

function openUpdateModal(release, downloadUrl, sizeText) {
  const modal = document.getElementById('updateModal');
  if (!modal) return;
  const tag = release.tag_name || release.name || 'Latest';
  const tagEl = document.getElementById('modalUpdateTag');
  if (tagEl) tagEl.textContent = `Release ${tag}`;

  const notesEl = document.getElementById('modalUpdateNotes');
  if (notesEl) {
    const rawBody = (release.body || 'New enhancements and improvements are available.').trim();
    notesEl.innerHTML = `<div style="font-weight:600; margin-bottom:6px; color:var(--ink);">${escapeHtml(release.name || tag)}</div><div>${escapeHtml(rawBody).replace(/\n/g, '<br>')}</div>`;
  }

  const btn = document.getElementById('modalDownloadBtn');
  if (btn) {
    btn.textContent = `⬇️ Download APK${sizeText}`;
    btn.onclick = () => openDownloadLink(downloadUrl);
  }

  modal.classList.add('show');
}

function closeUpdateModal() {
  const modal = document.getElementById('updateModal');
  if (modal) modal.classList.remove('show');
}

async function checkForUpdates() {
  if (isCheckingUpdate) return;
  isCheckingUpdate = true;

  const btn = document.getElementById('btnCheckUpdate');
  const statusEl = document.getElementById('updateStatusArea');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span>⏳</span> Checking...';
  }
  if (statusEl) {
    statusEl.innerHTML = '<div style="color:var(--ink-soft); font-size:12px; padding:6px 0;">Connecting to GitHub Releases...</div>';
  }

  try {
    const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/releases`, {
      headers: { 'Accept': 'application/vnd.github.v3+json' }
    });

    if (!res.ok) {
      if (res.status === 404) {
        lastUpdateStatus = { type: 'success', msg: `You are up to date! Khata v${APP_VERSION} is the latest version.` };
        renderUpdateStatus();
        return;
      }
      if (res.status === 403) {
        lastUpdateStatus = { type: 'error', msg: 'GitHub server is busy (Rate limit reached). Please try again in a little while.' };
        renderUpdateStatus();
        return;
      }
      throw new Error(`GitHub API returned status ${res.status}`);
    }

    const releases = await res.json();
    const valid = Array.isArray(releases) ? releases.filter(r => !r.draft) : [];

    if (valid.length === 0) {
      lastUpdateStatus = { type: 'success', msg: `You are up to date! Khata v${APP_VERSION} is the latest version.` };
      renderUpdateStatus();
      return;
    }

    const latest = valid[0];
    const latestTag = latest.tag_name || latest.name || '';
    const isNewer = compareVersions(latestTag, APP_VERSION) > 0;

    if (isNewer) {
      const apkAsset = (latest.assets || []).find(a => a.name && a.name.toLowerCase().endsWith('.apk'));
      const downloadUrl = apkAsset ? apkAsset.browser_download_url : (latest.html_url || `https://github.com/${GITHUB_REPO}/releases`);
      const sizeText = apkAsset && apkAsset.size ? ` (${(apkAsset.size / (1024 * 1024)).toFixed(1)} MB)` : '';

      lastUpdateStatus = {
        type: 'new_version',
        latest,
        downloadUrl,
        sizeText
      };
      renderUpdateStatus();
      openUpdateModal(latest, downloadUrl, sizeText);
    } else {
      lastUpdateStatus = { type: 'success', msg: `You are up to date! Khata v${APP_VERSION} is the latest version.` };
      renderUpdateStatus();
    }
  } catch (err) {
    console.error('Update check failed:', err);
    let errMsg = 'Unable to check for updates. Check internet connection.';
    if (window.location && window.location.protocol === 'file:') {
      errMsg = 'Local file preview cannot access GitHub API. Works on hosted app and APK.';
    } else if (err && err.message && err.message.includes('403')) {
      errMsg = 'GitHub server is busy (Rate limit reached). Please try again in a little while.';
    }
    lastUpdateStatus = { type: 'error', msg: errMsg };
    renderUpdateStatus();
  } finally {
    isCheckingUpdate = false;
    const btnDone = document.getElementById('btnCheckUpdate');
    if (btnDone) {
      btnDone.disabled = false;
      btnDone.innerHTML = '<span>🔄</span> Check for Updates';
    }
  }
}

function renderUpdateStatus() {
  const statusEl = document.getElementById('updateStatusArea');
  if (!statusEl || !lastUpdateStatus) return;

  if (lastUpdateStatus.type === 'new_version') {
    const { latest, downloadUrl, sizeText } = lastUpdateStatus;
    const tag = latest.tag_name || latest.name || 'New version';
    statusEl.innerHTML = `
      <div style="background:var(--teal-soft); border:1px solid var(--teal); border-radius:12px; padding:12px; margin-top:8px;">
        <div style="font-weight:700; color:var(--teal); font-size:13px; margin-bottom:4px;">🎉 Update available: ${escapeHtml(tag)}</div>
        <div style="font-size:12px; color:var(--ink-soft); margin-bottom:10px;">${escapeHtml(latest.name || 'New release')} is ready to download!</div>
        <button class="btn primary small" style="width:100%; margin-bottom:6px;" onclick="openDownloadLink('${downloadUrl}')">
          ⬇️ Download APK${sizeText}
        </button>
        <a href="${latest.html_url}" target="_blank" rel="noopener noreferrer" style="display:block; text-align:center; font-size:11.5px; color:var(--ink-soft); text-decoration:underline;">View release notes on GitHub</a>
      </div>`;
  } else if (lastUpdateStatus.type === 'success') {
    statusEl.innerHTML = `<div style="background:var(--teal-soft); color:var(--teal); padding:10px 12px; border-radius:10px; font-weight:600; font-size:12px; margin-top:8px;">✓ ${escapeHtml(lastUpdateStatus.msg)}</div>`;
  } else if (lastUpdateStatus.type === 'error') {
    statusEl.innerHTML = `<div style="background:var(--rust-soft); color:var(--rust); padding:10px 12px; border-radius:10px; font-weight:600; font-size:12px; margin-top:8px;">⚠️ ${escapeHtml(lastUpdateStatus.msg)}</div>`;
  }
}

function driveConfigured(){
  return GOOGLE_CLIENT_ID && GOOGLE_CLIENT_ID.indexOf('PASTE_YOUR') !== 0;
}

function initDrive(){
  if(!driveConfigured()) return;
  if(typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2) return;
  driveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: (resp)=>{
      if(resp.error){ setSyncMsg('Sign-in failed. Please try again.'); return; }
      driveAccessToken = resp.access_token;
      if(drivePendingAction==='restore') driveRestoreNow();
      else driveBackupNow();
    }
  });
}

function setSyncMsg(msg){
  const el = document.getElementById('syncMsg');
  if(el) el.textContent = msg;
}

async function driveFindFile(){
  const res = await fetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=' +
    encodeURIComponent("name='"+DRIVE_FILENAME+"'") + '&fields=files(id,name)', {
    headers:{Authorization:'Bearer '+driveAccessToken}
  });
  if(!res.ok) throw new Error('Could not reach Google Drive.');
  const data = await res.json();
  return (data.files && data.files[0]) || null;
}

async function driveBackupNow(){
  try{
    setSyncMsg('Backing up…');
    const file = await driveFindFile();
    const payload = JSON.stringify({
      transactions: state.transactions, categories: state.categories,
      sources: state.sources, accounts: state.accounts, recurring: state.recurring,
      debts: state.debts
    });
    const metadata = {name: DRIVE_FILENAME, mimeType:'application/json'};
    if(!file) metadata.parents = ['appDataFolder'];
    const boundary = 'khata_boundary_xyz';
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`+
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n${payload}\r\n`+
      `--${boundary}--`;
    const url = file
      ? `https://www.googleapis.com/upload/drive/v3/files/${file.id}?uploadType=multipart`
      : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
    const res = await fetch(url, {
      method: file ? 'PATCH' : 'POST',
      headers:{Authorization:'Bearer '+driveAccessToken, 'Content-Type':`multipart/related; boundary=${boundary}`},
      body
    });
    if(!res.ok) throw new Error('Upload failed');
    driveStatus.lastSync = new Date().toISOString();
    DB.set('driveStatus', driveStatus);
    setSyncMsg('Backed up just now ✓ (' + new Date().toLocaleTimeString() + ')');
  }catch(e){
    setSyncMsg('Backup failed. Check your connection and try again.');
  }
}

async function driveRestoreNow(){
  try{
    setSyncMsg('Checking Drive…');
    const file = await driveFindFile();
    if(!file){ setSyncMsg('No backup found on Drive yet.'); return; }
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`, {
      headers:{Authorization:'Bearer '+driveAccessToken}
    });
    if(!res.ok) throw new Error('Download failed');
    const data = await res.json();
    if(!confirm('This will replace everything on this device with your Drive backup. Continue?')){
      setSyncMsg(''); return;
    }
    state.transactions = data.transactions || [];
    state.categories = data.categories || DEFAULT_CATEGORIES.slice();
    state.sources = data.sources || DEFAULT_SOURCES.slice();
    state.accounts = data.accounts || DEFAULT_ACCOUNTS.slice();
    state.recurring = data.recurring || [];
    state.debts = data.debts || [];
    persist(false);
    setSyncMsg('Restored ✓');
    render();
  }catch(e){
    setSyncMsg('Restore failed. Check your connection and try again.');
  }
}

function fmt(n){
  n = Number(n)||0;
  const neg = n < 0;
  n = Math.abs(n);
  const s = n.toLocaleString('en-US', {maximumFractionDigits:0});
  return (neg?'-':'') + '৳' + s;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function totals(){
  let income=0, expense=0;
  state.transactions.forEach(t=>{
    if(t.type==='income') income += t.amount;
    else if(t.type==='expense') expense += t.amount;
  });
  return {income, expense, balance: income-expense};
}

function debtTotals(){
  let receivable = 0;
  let payable = 0;

  state.debts.forEach(d=>{
    if(!d.settled){
      if(d.type === 'lend') receivable += d.amount;
      else if(d.type === 'borrow') payable += d.amount;
    }
  });
  return {receivable, payable, netReceivable: receivable - payable};
}

function accountBalances(){
  const bal = {};
  state.accounts.forEach(a=> bal[a]=0);
  
  state.transactions.forEach(t=>{
    if(t.type==='income'){ bal[t.account] = (bal[t.account]||0) + t.amount; }
    else if(t.type==='expense'){ bal[t.account] = (bal[t.account]||0) - t.amount; }
    else if(t.type==='transfer'){
      bal[t.from] = (bal[t.from]||0) - t.amount;
      bal[t.to] = (bal[t.to]||0) + t.amount;
    }
    else if(t.type==='lend'){
      bal[t.account] = (bal[t.account]||0) - t.amount;
    }
    else if(t.type==='borrow'){
      bal[t.account] = (bal[t.account]||0) + t.amount;
    }
    else if(t.type==='settle_lend'){
      bal[t.account] = (bal[t.account]||0) + t.amount;
    }
    else if(t.type==='settle_borrow'){
      bal[t.account] = (bal[t.account]||0) - t.amount;
    }
  });
  return bal;
}

function inRange(iso, period){
  const d = new Date(iso+'T00:00:00');
  const now = new Date();
  if(period==='week'){
    const start = new Date(now); start.setDate(now.getDate()-6); start.setHours(0,0,0,0);
    return d >= start && d <= now;
  }
  if(period==='month'){
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  }
  if(period==='year'){
    return d.getFullYear()===now.getFullYear();
  }
  return true;
}

function reportData(period){
  let income=0, expense=0;
  const catMap = {};
  state.transactions.forEach(t=>{
    if(!inRange(t.date, period)) return;
    if(t.type==='income') income += t.amount;
    else if(t.type==='expense'){
      expense += t.amount;
      catMap[t.category] = (catMap[t.category]||0) + t.amount;
    }
  });
  const cats = Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
  return {income, expense, remaining: income-expense, cats};
}

function sortedTransactions(){
  return state.transactions.slice().sort((a,b)=>{
    if(b.date !== a.date) return b.date.localeCompare(a.date);
    return (b.ts || 0) - (a.ts || 0);
  });
}

function emptyState(big, small){

function txRow(t){
  let icon = '↓';
  let title = '';
  let sign = '';
  let sub = `${t.account || ''} · ${fmtDate(t.date)}` + (t.note? ' · '+escapeHtml(t.note): '');

  if(t.type === 'income'){
    icon = '↓'; title = t.source || 'Income'; sign = '+';
  } else if(t.type === 'expense'){
    icon = '↑'; title = t.category || 'Expense'; sign = '−';
  } else if(t.type === 'transfer'){
    icon = '⇄'; title = `${t.from} → ${t.to}`; sign = '';
    sub = fmtDate(t.date);
  } else if(t.type === 'lend'){
    icon = '🤝'; title = `Lent to ${t.person}`; sign = '−';
  } else if(t.type === 'borrow'){
    icon = '🤲'; title = `Borrowed from ${t.person}`; sign = '+';
  } else if(t.type === 'settle_lend'){
    icon = '✓'; title = `Received back from ${t.person}`; sign = '+';
  } else if(t.type === 'settle_borrow'){
    icon = '✓'; title = `Paid back to ${t.person}`; sign = '−';
  }

  return `<div class="tx ${t.type}">
    <div class="dot">${icon}</div>
    <div class="mid">
      <div class="t1">${escapeHtml(title)}</div>
      <div class="t2">${sub}</div>
    </div>
    <div class="amt tabular">${sign}${fmt(t.amount)}</div>
    <div style="position:relative; margin-left:8px;">
      <button onclick="toggleTxMenu(event, '${t.id}')" style="background:none; border:none; font-size:18px; color:var(--ink-faint); cursor:pointer; padding:4px 8px;">⋮</button>
    </div>
  </div>`;
}

function editTransaction(id){
  const t = state.transactions.find(x => x.id === id);
  if(!t) return;

  if(t.type === 'settle_lend' || t.type === 'settle_borrow'){
    alert('Settlement history entries cannot be edited. You can delete it or add a new transaction.');
    return;
  }

  openAdd(t.type);

  if(document.getElementById('fAmount')) document.getElementById('fAmount').value = t.amount;
  if(document.getElementById('fDate')) document.getElementById('fDate').value = t.date;
  if(document.getElementById('fNote') && t.note) document.getElementById('fNote').value = t.note;

  if(t.type === 'income' && document.getElementById('fSource')) document.getElementById('fSource').value = t.source;
  if(t.type === 'expense' && document.getElementById('fCategory')) document.getElementById('fCategory').value = t.category;
  if(t.type === 'transfer'){
    if(document.getElementById('fFrom')) document.getElementById('fFrom').value = t.from;
    if(document.getElementById('fTo')) document.getElementById('fTo').value = t.to;
  }
  if((t.type === 'lend' || t.type === 'borrow')){
    if(document.getElementById('fPerson')) document.getElementById('fPerson').value = t.person;
    if(document.getElementById('fAccount')) document.getElementById('fAccount').value = t.account;
  } else if(document.getElementById('fAccount')){
    document.getElementById('fAccount').value = t.account;
  }

  if(t.debtId){
    state.debts = state.debts.filter(d => d.id !== t.debtId);
  }

  state.transactions = state.transactions.filter(x => x.id !== id);
  persist();
  render();
}

function deleteTransaction(id){
  const t = state.transactions.find(x => x.id === id);
  if(t && t.debtId){
    state.debts = state.debts.filter(d => d.id !== t.debtId);
  }
  state.transactions = state.transactions.filter(t => t.id !== id);
  persist();
  render();
}

function escapeHtml(s){
  if(s===undefined || s===null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function settleDebt(debtId){
  const d = state.debts.find(x => x.id === debtId);
  if(!d) return;

  const actionText = d.type === 'lend' 
    ? `Have you collected ${fmt(d.amount)} from ${d.person}? This will add the cash back into ${d.account}.`
    : `Have you paid back ${fmt(d.amount)} to ${d.person}? This will deduct the cash from ${d.account}.`;

  if(!confirm(actionText)) return;

  d.settled = true;
  d.settledDate = todayISO();

  state.transactions.push({
    id: uid(),
    type: d.type === 'lend' ? 'settle_lend' : 'settle_borrow',
    amount: d.amount,
    person: d.person,
    account: d.account,
    date: todayISO(),
    note: `Settled ${d.type === 'lend' ? 'Paona' : 'Dena'}`,
    ts: Date.now()
  });

  persist();
  render();
}

  <div class="sec-head" style="margin-top:20px;"><h3>Your data</h3></div>

    <div>

      <div class="t2">Restore data from a JSON backup</div>

    <a onclick="document.getElementById('importFileInput').click()" style="font-size:13px;font-weight:600;color:var(--teal);cursor:pointer;">Import</a>
    <input type="file" id="importFileInput" accept=".json,application/json" style="display:none;" onchange="importData(event)">
  </div>
  <div class="manage-row">
    <div>
      <div class="t1">Erase everything</div>
      <div class="t2">Permanently wipe all local records</div>
    </div>

  return html;
}
function escId(s){ return String(s).replace(/'/g,"\\'"); }

function addCategory(){
  const el = document.getElementById('newCatInput');
  const v = el.value.trim();
  if(!v) return;
  if(!state.categories.includes(v)) state.categories.push(v);
  persist(); render();
}
function removeCategory(c){ state.categories = state.categories.filter(x=>x!==c); persist(); render(); }

function addSource(){
  const el = document.getElementById('newSrcInput');
  const v = el.value.trim();
  if(!v) return;
  if(!state.sources.includes(v)) state.sources.push(v);
  persist(); render();
}
function removeSource(s){ state.sources = state.sources.filter(x=>x!==s); persist(); render(); }

function addAccount(){
  const el = document.getElementById('newAccInput');
  const v = el.value.trim();
  if(!v) return;
  if(!state.accounts.includes(v)) state.accounts.push(v);
  persist(); render();
}
function removeAccount(a){ state.accounts = state.accounts.filter(x=>x!==a); persist(); render(); }

function addRecurring(){
  const name = document.getElementById('recName').value.trim();
  const amount = parseFloat(document.getElementById('recAmount').value);
  const account = document.getElementById('recAccount').value;
  const day = parseInt(document.getElementById('recDay').value);
  if(!name || !amount || amount<=0 || !day || day<1 || day>31){
    alert('Please fill in a bill name, a valid amount, and a day between 1 and 31.');
    return;
  }
  state.recurring.push({id:uid(), name, amount, account, day});
  persist(); render();
}
function removeRecurring(id){ state.recurring = state.recurring.filter(r=>r.id!==id); persist(); render(); }

async function exportData(){
  const backup = {
    transactions: state.transactions,
    categories: state.categories,
    sources: state.sources,
    accounts: state.accounts,
    recurring: state.recurring,
    debts: state.debts,
    version: APP_VERSION,
    exportedAt: new Date().toISOString()
  };
  const jsonStr = JSON.stringify(backup, null, 2);
  const filename = 'khata-backup.json';

  if (navigator.share) {
    try {
      const file = new File([jsonStr], filename, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({
          files: [file],
          title: 'Khata Backup',
          text: 'Khata Backup (' + todayISO() + ')'
        });
        return;
      }
    } catch (err) {
      if (err && err.name === 'AbortError') return;
      console.warn('Web Share failed, falling back to data URL download:', err);
    }
  }

  try {
    const dataUrl = 'data:application/json;charset=utf-8,' + encodeURIComponent(jsonStr);
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      if (a.parentNode) a.parentNode.removeChild(a);
    }, 1000);
  } catch (err) {
    console.error('Data URL export failed:', err);
    alert('Unable to export backup: ' + err.message);
  }
}

function importData(event){
  const file = event.target.files && event.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const data = JSON.parse(e.target.result);

      const hasTransactions = Array.isArray(data.transactions);
      const hasCategories = Array.isArray(data.categories);
      const hasAccounts = Array.isArray(data.accounts);

      if (!hasTransactions && !hasCategories && !hasAccounts) {
        alert('Invalid backup file. The selected JSON file does not contain Khata transactions, accounts, or categories.');
        event.target.value = '';
        return;
      }

      const txCount = hasTransactions ? data.transactions.length : 0;
      const accCount = hasAccounts ? data.accounts.length : 0;
      const catCount = hasCategories ? data.categories.length : 0;

      const confirmMsg = `Restore this backup?\n\n` +
        `• Transactions: ${txCount}\n` +
        `• Accounts: ${accCount}\n` +
        `• Categories: ${catCount}\n\n` +
        `WARNING: This will replace your current transactions and ledger records. Continue?`;

      if (!confirm(confirmMsg)) {
        event.target.value = '';
        return;
      }

      if (hasTransactions) state.transactions = data.transactions;
      if (hasCategories) state.categories = data.categories;
      if (Array.isArray(data.sources)) state.sources = data.sources;
      if (hasAccounts) state.accounts = data.accounts;
      if (Array.isArray(data.recurring)) state.recurring = data.recurring;
      if (Array.isArray(data.debts)) state.debts = data.debts;

      persist();
      render();
      alert('Data imported successfully!');
    } catch(err) {
      console.error('Import parse error:', err);
      alert('Failed to parse JSON file. Please ensure it is a valid Khata backup file.');
    } finally {
      event.target.value = '';
    }
  };

  reader.onerror = function(){
    alert('Error reading the selected file. Please try again.');
    event.target.value = '';
  };

  reader.readAsText(file);
}

function eraseAll(){
  if(!confirm('This will permanently delete all records including transactions, accounts, receivables and payables. Continue?')) return;
  state.transactions = []; state.categories = DEFAULT_CATEGORIES.slice();
  state.sources = DEFAULT_SOURCES.slice(); state.accounts = DEFAULT_ACCOUNTS.slice();
  state.recurring = []; state.debts = [];
  persist(); render();
}

function goTab(t){ state.tab = t; render(); }

function render(){
  const content = document.getElementById('content');
  if(state.tab==='home') content.innerHTML = renderHome();
  else if(state.tab==='history') content.innerHTML = renderHistory();
  else if(state.tab==='accounts') content.innerHTML = renderAccounts();
  else if(state.tab==='reports') content.innerHTML = renderReports();
  else if(state.tab==='settings'){
    content.innerHTML = renderSettings();
    renderUpdateStatus();
  }

  document.querySelectorAll('nav.bottom button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab===state.tab);
  });
  content.scrollTop = 0;
}

document.querySelectorAll('nav.bottom button').forEach(b=>{
  b.addEventListener('click', ()=> goTab(b.dataset.tab));
});

let addType = 'expense';

function openAdd(type){
  addType = type || 'expense';
  document.getElementById('sheetOverlay').classList.add('show');
  renderSheet();
}
function closeSheet(){
  document.getElementById('sheetOverlay').classList.remove('show');
}
document.getElementById('fabAdd').addEventListener('click', ()=> openAdd('expense'));
document.getElementById('sheetOverlay').addEventListener('click', (e)=>{
  if(e.target.id==='sheetOverlay') closeSheet();
});

function setAddType(t){ addType = t; renderSheet(); }

function renderSheet(){
  const body = document.getElementById('sheetBody');
  const catOptions = state.categories.map(c=>`<option>${escapeHtml(c)}</option>`).join('');
  const srcOptions = state.sources.map(c=>`<option>${escapeHtml(c)}</option>`).join('');
  const accOptions = state.accounts.map(c=>`<option>${escapeHtml(c)}</option>`).join('');

  let fields = '';
  if(addType==='income'){
    fields = `
      <label class="field"><span class="fl">Amount</span>
        <div class="amount-input"><span class="sym">৳</span><input id="fAmount" type="number" inputmode="decimal" placeholder="0" autofocus></div>
      </label>
      <label class="field"><span class="fl">Date</span><input id="fDate" type="date" value="${todayISO()}"></label>
      <label class="field"><span class="fl">Source</span><select id="fSource">${srcOptions}</select></label>
      <label class="field"><span class="fl">Account</span><select id="fAccount">${accOptions}</select></label>
      <label class="field"><span class="fl">Note (optional)</span><input id="fNote" placeholder="e.g. Monthly allowance"></label>
    `;
  } else if(addType==='expense'){
    fields = `
      <label class="field"><span class="fl">Amount</span>
        <div class="amount-input"><span class="sym">৳</span><input id="fAmount" type="number" inputmode="decimal" placeholder="0" autofocus></div>
      </label>
      <label class="field"><span class="fl">Date</span><input id="fDate" type="date" value="${todayISO()}"></label>
      <label class="field"><span class="fl">Category</span><select id="fCategory">${catOptions}</select></label>
      <label class="field"><span class="fl">Account</span><select id="fAccount">${accOptions}</select></label>
      <label class="field"><span class="fl">Note (optional)</span><input id="fNote" placeholder="e.g. Lunch"></label>
    `;
  } else if(addType==='transfer'){
    fields = `
      <label class="field"><span class="fl">Amount</span>
        <div class="amount-input"><span class="sym">৳</span><input id="fAmount" type="number" inputmode="decimal" placeholder="0" autofocus></div>
      </label>
      <label class="field"><span class="fl">Date</span><input id="fDate" type="date" value="${todayISO()}"></label>
      <label class="field"><span class="fl">From account</span><select id="fFrom">${accOptions}</select></label>
      <label class="field"><span class="fl">To account</span><select id="fTo">${accOptions}</select></label>
      <label class="field"><span class="fl">Note (optional)</span><input id="fNote" placeholder="e.g. Moving to bank"></label>
    `;
  } else if(addType==='lend'){
    fields = `
      <label class="field"><span class="fl">Lend Amount (Receivable)</span>
        <div class="amount-input"><span class="sym">৳</span><input id="fAmount" type="number" inputmode="decimal" placeholder="0" autofocus></div>
      </label>
      <label class="field"><span class="fl">Who owes you? (Person, Store, or Entity)</span><input id="fPerson" placeholder="e.g. Shakil"></label>
      <label class="field"><span class="fl">Date</span><input id="fDate" type="date" value="${todayISO()}"></label>
      <label class="field"><span class="fl">Paid from Account</span><select id="fAccount">${accOptions}</select></label>
      <label class="field"><span class="fl">Note (optional)</span><input id="fNote" placeholder="e.g. Lunch bill dhar nilo"></label>
    `;
  } else if(addType==='borrow'){
    fields = `
      <label class="field"><span class="fl">Borrow Amount (Payable)</span>
        <div class="amount-input"><span class="sym">৳</span><input id="fAmount" type="number" inputmode="decimal" placeholder="0" autofocus></div>
      </label>
      <label class="field"><span class="fl">Who did you borrow from? (Person, Bank, or Entity)</span><input id="fPerson" placeholder="e.g. Tanvir"></label>
      <label class="field"><span class="fl">Date</span><input id="fDate" type="date" value="${todayISO()}"></label>
      <label class="field"><span class="fl">Received into Account</span><select id="fAccount">${accOptions}</select></label>
      <label class="field"><span class="fl">Note (optional)</span><input id="fNote" placeholder="e.g. Hostel rent dhar"></label>
    `;
  }

  body.innerHTML = `
    <div class="handle"></div>
    <h2>${addType==='income'?'Add income':addType==='expense'?'Add expense':addType==='transfer'?'Transfer':addType==='lend'?'Lend Money (Paona)': 'Borrow Money (Dena)'}</h2>
    <div class="segmented">
      <button class="${addType==='income'?'active':''}" onclick="setAddType('income')">Income</button>
      <button class="${addType==='expense'?'active':''}" onclick="setAddType('expense')">Expense</button>
      <button class="${addType==='transfer'?'active':''}" onclick="setAddType('transfer')">Transfer</button>
      <button class="${addType==='lend'?'active':''}" onclick="setAddType('lend')">Lend</button>
      <button class="${addType==='borrow'?'active':''}" onclick="setAddType('borrow')">Borrow</button>
    </div>
    <div class="err-msg" id="errMsg"></div>
    ${fields}
    <button class="btn primary" onclick="saveTransaction()">Save</button>
    <button class="btn ghost" onclick="closeSheet()">Cancel</button>
  `;
}

function showErr(msg){
  const el = document.getElementById('errMsg');
  el.textContent = msg;
  el.style.display = 'block';
}

function saveTransaction(){
  const amountEl = document.getElementById('fAmount');
  const amount = parseFloat(amountEl.value);
  const dateEl = document.getElementById('fDate');
  const date = (dateEl && dateEl.value) ? dateEl.value : todayISO();
  const note = document.getElementById('fNote').value.trim();
  const ts = Date.now();

  if(!amount || amount <= 0){
    showErr('Please enter a valid amount greater than zero.');
    return;
  }

  if(addType==='income'){
    const source = document.getElementById('fSource').value;
    const account = document.getElementById('fAccount').value;
    state.transactions.push({id:uid(), type:'income', amount, source, account, note, date, ts});
  } else if(addType==='expense'){
    const category = document.getElementById('fCategory').value;
    const account = document.getElementById('fAccount').value;
    state.transactions.push({id:uid(), type:'expense', amount, category, account, note, date, ts});
  } else if(addType==='transfer'){
    const from = document.getElementById('fFrom').value;
    const to = document.getElementById('fTo').value;
    if(from === to){
      showErr('From and to accounts must be different.');
      return;
    }
    state.transactions.push({id:uid(), type:'transfer', amount, from, to, note, date, ts});
  } else if(addType==='lend' || addType==='borrow'){
    const person = document.getElementById('fPerson').value.trim();
    const account = document.getElementById('fAccount').value;
    if(!person){
      showErr('Please enter the name of the person, store, or entity.');
      return;
    }
    const debtId = uid();
    state.debts.push({
      id: debtId,
      type: addType,
      person,
      amount,
      account,
      date,
      note,
      settled: false
    });
    state.transactions.push({
      id: uid(),
      type: addType,
      debtId,
      amount,
      person,
      account,
      note,
      date,
      ts
    });
  }

  persist();
  closeSheet();
  render();
}

render();
