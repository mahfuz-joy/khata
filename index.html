<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1C2B39">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Khata">
<title>Khata — your money, plainly kept</title>
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231C2B39'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle' fill='%23C99A3D' font-family='Georgia,serif'%3E৳%3C/text%3E%3C/svg%3E">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --paper:#FAF6EF;
    --paper-raised:#FFFFFF;
    --ink:#1C2B39;
    --ink-soft:#5B6B78;
    --ink-faint:#94A0AA;
    --teal:#2F6F5E;
    --teal-soft:#E7EFEB;
    --rust:#B54834;
    --rust-soft:#F5E9E5;
    --gold:#C08A2E;
    --gold-soft:#F6EEDD;
    --line:#E6DFCF;
    --blue:#2B6CB0;
    --blue-soft:#EBF8FF;
    --purple:#6B46C1;
    --purple-soft:#FAF5FF;
    --radius-card:18px;
    --radius-sheet:22px;
    --font-display:'Fraunces',serif;
    --font-ui:'Inter',sans-serif;
  }
  body.dark-mode{
    --paper:#0f1720;
    --paper-raised:#18222d;
    --ink:#F3F6FA;
    --ink-soft:#9FB0C2;
    --ink-faint:#627488;
    --teal:#43C39E;
    --teal-soft:#17332B;
    --rust:#FF6B52;
    --rust-soft:#3C1F1A;
    --gold:#F5B742;
    --gold-soft:#3D2F14;
    --blue:#63B3ED;
    --blue-soft:#1A365D;
    --purple:#B794F4;
    --purple-soft:#322659;
    --line:#263546;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:#DCD3BE;
    font-family:var(--font-ui);
    color:var(--ink);
    display:flex;
    justify-content:center;
    min-height:100vh;
  }
  body.dark-mode{background:#070b10;}
  .app-shell{
    width:100%;
    max-width:460px;
    min-height:100vh;
    background:var(--paper);
    position:relative;
    display:flex;
    flex-direction:column;
    box-shadow:0 0 40px rgba(0,0,0,.15);
    overflow-x:hidden;
  }
  ::selection{background:var(--gold-soft);}
  .tabular{font-variant-numeric:tabular-nums;}

  header.top{
    padding:22px 20px 14px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-shrink:0;
  }
  header.top .brand{
    font-family:var(--font-display);
    font-weight:600;
    font-size:22px;
    letter-spacing:.2px;
  }
  header.top .brand span{color:var(--gold);}
  header.top .tagline{
    font-size:11px;
    color:var(--ink-faint);
  }

  #content{
    flex:1;
    overflow-y:auto;
    padding:0 20px 110px;
    -webkit-overflow-scrolling:touch;
  }

  .hero{
    background:var(--ink);
    color:var(--paper);
    border-radius:var(--radius-card);
    padding:22px;
    margin-bottom:18px;
  }
  body.dark-mode .hero{
    background:linear-gradient(135deg, #1A2836 0%, #111A23 100%);
    border:1px solid var(--line);
  }
  .hero .label{
    font-size:12px;
    color:var(--ink-faint);
    margin-bottom:4px;
  }
  .hero .balance{
    font-family:var(--font-display);
    font-size:36px;
    font-weight:600;
    line-height:1.1;
    margin-bottom:16px;
    color:var(--paper);
  }
  body.dark-mode .hero .balance{color:#FFFFFF; text-shadow:0 2px 10px rgba(0,0,0,.3);}
  .hero .row{
    display:flex;
    justify-content:space-between;
    border-top:1px solid rgba(255,255,255,.14);
    padding-top:12px;
  }
  .hero .row .item .k{font-size:11px;color:var(--ink-faint);margin-bottom:2px;}
  .hero .row .item .v{font-family:var(--font-display);font-size:16px;font-weight:600;}
  .hero .row .item.in .v{color:#8FD8BE;}
  body.dark-mode .hero .row .item.in .v{color:#43C39E;}
  .hero .row .item.out .v{color:#E6A08F;}
  body.dark-mode .hero .row .item.out .v{color:#FF8A75;}

  /* AR & AP Summary Badge in Home */
  .debt-summary-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:18px;
  }
  .debt-pill{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
    display:flex;
    flex-direction:column;
    gap:4px;
    cursor:pointer;
  }
  .debt-pill .label{font-size:11px; font-weight:600; color:var(--ink-faint); display:flex; align-items:center; gap:5px;}
  .debt-pill .val{font-family:var(--font-display); font-size:16px; font-weight:700;}
  .debt-pill.ar .val{color:var(--teal);}
  .debt-pill.ap .val{color:var(--rust);}

  .quick{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:12px;
  }
  .quick-extra{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:22px;
  }
  .quick button, .quick-extra button{
    font-family:var(--font-ui);
    font-size:13px;
    font-weight:600;
    padding:11px 6px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--paper-raised);
    color:var(--ink);
    cursor:pointer;
  }
  .quick button:active, .quick-extra button:active{transform:scale(.97);}
  .quick button.income{color:var(--teal);}
  .quick button.expense{color:var(--rust);}
  .quick button.transfer{color:var(--gold);}
  .quick-extra button.lend{color:var(--blue); border-color:rgba(43,108,176,0.3);}
  .quick-extra button.borrow{color:var(--purple); border-color:rgba(107,70,193,0.3);}

  .sec-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:22px 0 10px;
  }
  .sec-head h3{
    font-family:var(--font-display);
    font-size:16px;
    font-weight:600;
    margin:0;
  }
  .sec-head a{
    font-size:12px;
    color:var(--ink-soft);
    text-decoration:none;
    cursor:pointer;
  }

  .tx-list{border-top:1px solid var(--line);}
  .tx{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .tx .dot{
    width:38px;height:38px;flex-shrink:0;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
    background:var(--teal-soft); color:var(--teal);
  }
  .tx.expense .dot{background:var(--rust-soft); color:var(--rust);}
  .tx.transfer .dot{background:var(--gold-soft); color:var(--gold);}
  .tx.lend .dot{background:var(--blue-soft); color:var(--blue);}
  .tx.borrow .dot{background:var(--purple-soft); color:var(--purple);}
  .tx .mid{flex:1; min-width:0;}
  .tx .mid .t1{font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tx .mid .t2{font-size:12px; color:var(--ink-faint); margin-top:1px;}
  .tx .amt{font-family:var(--font-display); font-weight:600; font-size:15px; white-space:nowrap;}
  .tx.income .amt{color:var(--teal);}
  .tx.expense .amt{color:var(--rust);}
  .tx.transfer .amt{color:var(--gold);}
  .tx.lend .amt{color:var(--blue);}
  .tx.borrow .amt{color:var(--purple);}

  .debt-card-row{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .debt-card-row.settled{opacity:0.6;}
  .debt-card-row .p-name{font-weight:700; font-size:14.5px; margin-bottom:2px;}
  .debt-card-row .p-sub{font-size:11.5px; color:var(--ink-faint);}
  .debt-card-row .right-side{text-align:right;}
  .debt-card-row .p-amt{font-family:var(--font-display); font-weight:700; font-size:16px;}
  .debt-card-row .settle-btn{
    margin-top:4px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:4px 10px;
    border-radius:8px;
    font-size:11px;
    font-weight:600;
    cursor:pointer;
  }
  body.dark-mode .debt-card-row .settle-btn{background:var(--gold); color:#000;}

  .empty{
    text-align:center;
    padding:34px 10px;
    color:var(--ink-faint);
    font-size:13px;
  }
  .empty .big{font-family:var(--font-display); font-size:15px; color:var(--ink-soft); margin-bottom:4px;}

  .acc-grid{display:flex; flex-direction:column; gap:10px; margin-bottom:10px;}
  .acc-card{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
  }
  .acc-card .name{font-size:14px; font-weight:600;}
  .acc-card .bal{font-family:var(--font-display); font-size:17px; font-weight:600;}
  .acc-total{
    background:var(--ink); color:var(--paper);
    border-radius:14px; padding:16px;
    display:flex; justify-content:space-between; align-items:center;
    margin-top:4px;
  }
  body.dark-mode .acc-total{background:var(--paper-raised); color:var(--ink); border:1px solid var(--line);}
  .acc-total .name{font-size:13px; color:var(--ink-faint);}
  .acc-total .bal{font-family:var(--font-display); font-size:19px; font-weight:700;}

  label.field{display:block; margin-bottom:16px;}
  label.field .fl{font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; display:block;}
  .field input, .field select, .field textarea{
    width:100%;
    font-family:var(--font-ui);
    font-size:15px;
    padding:12px 13px;
    border-radius:11px;
    border:1px solid var(--line);
    background:var(--paper-raised);
    color:var(--ink);
    appearance:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--gold); outline-offset:1px;
  }
  .amount-input{position:relative;}
  .amount-input .sym{
    position:absolute; left:13px; top:50%; transform:translateY(-50%);
    font-family:var(--font-display); font-weight:600; color:var(--ink-soft);
    pointer-events:none;
  }
  .amount-input input{padding-left:30px; font-family:var(--font-display); font-weight:600; font-size:19px;}

  .segmented{
    display:flex;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    padding:3px;
    margin-bottom:20px;
    overflow-x:auto;
  }
  .segmented button{
    flex:1;
    border:none;
    background:transparent;
    padding:9px 4px;
    font-family:var(--font-ui);
    font-weight:600;
    font-size:12px;
    color:var(--ink-soft);
    border-radius:9px;
    cursor:pointer;
    white-space:nowrap;
  }
  .segmented button.active{background:var(--ink); color:var(--paper);}
  body.dark-mode .segmented button.active{background:var(--paper-raised); color:var(--ink); border:1px solid var(--line);}

  .btn{
    display:block;
    width:100%;
    text-align:center;
    padding:14px;
    border-radius:12px;
    border:none;
    font-family:var(--font-ui);
    font-weight:700;
    font-size:15px;
    cursor:pointer;
  }
  .btn.primary{background:var(--ink); color:var(--paper);}
  body.dark-mode .btn.primary{background:var(--paper-raised); color:var(--ink); border:1px solid var(--line);}
  .btn.primary:active{opacity:.85;}
  .btn.ghost{background:transparent; color:var(--ink-soft); margin-top:8px;}
  .btn.small{padding:10px 14px; font-size:13px; width:auto; border-radius:10px;}
  .err-msg{
    background:var(--rust-soft); color:var(--rust);
    border-radius:10px; padding:10px 12px; font-size:12.5px;
    margin-bottom:14px; display:none; font-weight:600;
  }

  .pill-list{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
  .pill{
    background:var(--paper); border:1px solid var(--line);
    border-radius:20px; padding:6px 12px; font-size:12px;
    display:flex; align-items:center; gap:6px;
  }
  .pill .x{color:var(--rust); cursor:pointer; font-weight:700;}
  .row-inline{display:flex; gap:8px; margin-bottom:8px;}
  .row-inline input{flex:1;}

  .manage-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .manage-row .t1{font-size:14px; font-weight:600;}
  .manage-row .t2{font-size:12px; color:var(--ink-faint);}
  .manage-row .x{color:var(--rust); font-size:13px; font-weight:600; cursor:pointer;}

  /* Collapsible Accordions */
  .accordion-box{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:14px;
    margin-bottom:12px;
    overflow:hidden;
  }
  .accordion-head{
    padding:15px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    user-select:none;
  }
  .accordion-head h4{
    font-family:var(--font-display);
    font-size:14.5px;
    font-weight:600;
    margin:0;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .accordion-head .arrow{
    font-size:12px;
    color:var(--ink-faint);
    transition:transform .2s ease;
  }
  .accordion-box.active .accordion-head .arrow{
    transform:rotate(180deg);
  }
  .accordion-body{
    display:none;
    padding:6px 16px 16px;
    border-top:1px solid var(--line);
  }
  .accordion-box.active .accordion-body{
    display:block;
  }

  .period-tabs{display:flex; gap:8px; margin-bottom:18px; overflow-x:auto;}
  .period-tabs button{
    white-space:nowrap;
    padding:8px 14px; border-radius:20px; border:1px solid var(--line);
    background:var(--paper-raised); font-size:12.5px; font-weight:600; color:var(--ink-soft);
    cursor:pointer;
  }
  .period-tabs button.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  body.dark-mode .period-tabs button.active{background:var(--paper-raised); color:var(--ink); border-color:var(--line);}
  
  .stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:22px;}
  .stat{background:var(--paper-raised); border:1px solid var(--line); border-radius:14px; padding:14px 10px;}
  .stat .k{font-size:11px; color:var(--ink-faint); margin-bottom:4px;}
  .stat .v{font-family:var(--font-display); font-weight:700; font-size:16px;}
  .stat.in .v{color:var(--teal);} .stat.out .v{color:var(--rust);}
  .bar-row{margin-bottom:14px;}
  .bar-row .top{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:5px;}
  .bar-row .top .amt{font-weight:600;}
  .bar-track{height:8px; background:var(--line); border-radius:6px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--rust); border-radius:6px;}

  nav.bottom{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:460px;
    background:var(--paper-raised);
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    z-index:90;
  }
  nav.bottom button{
    flex:1;
    background:none; border:none;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:6px 2px;
    color:var(--ink-faint);
    cursor:pointer;
    font-family:var(--font-ui);
  }
  nav.bottom button.active{color:var(--ink);}
  nav.bottom button svg{width:21px; height:21px;}
  nav.bottom button span{font-size:10px; font-weight:600;}

  .fab{
    position:fixed;
    right:max(20px, calc(50% - 210px));
    bottom:calc(75px + env(safe-area-inset-bottom));
    width:56px;
    height:56px;
    border-radius:50%;
    background:var(--gold);
    color:#fff;
    border:none;
    font-size:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 8px 20px rgba(192,138,46,.45);
    cursor:pointer;
    z-index:95;
  }
  .fab:active{transform:scale(.94);}

  .sheet-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.6);
    z-index:96;
    display:none;
  }
  .sheet-overlay.show{display:block;}
  .sheet{
    position:fixed; left:50%; bottom:0;
    transform:translate(-50%, 100%);
    width:100%; max-width:460px;
    background:var(--paper);
    border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;
    padding:20px 20px calc(24px + env(safe-area-inset-bottom));
    max-height:90%;
    overflow-y:auto;
    transition:transform .28s cubic-bezier(.2,.8,.2,1);
    z-index:97;
  }
  .sheet-overlay.show .sheet{transform:translate(-50%, 0);}
  .sheet .handle{width:38px; height:4px; background:var(--line); border-radius:3px; margin:0 auto 16px;}
  .sheet h2{font-family:var(--font-display); font-size:19px; margin:0 0 18px;}

  /* Developer modal overlay: fixed in screen center */
  .dev-modal{
    position:fixed !important;
    top:0; left:0; right:0; bottom:0;
    width:100vw; height:100vh;
    background:rgba(0,0,0,.75);
    z-index:9999 !important;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    box-sizing:border-box;
  }
  .dev-modal.show{display:flex !important;}
  .dev-card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:20px;
    padding:26px 22px;
    width:100%;
    max-width:340px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
  }
  .dev-avatar{
    width:80px; height:80px;
    border-radius:50%;
    margin:0 auto 14px;
    border:2.5px solid var(--gold);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--gold-soft);
  }
  .dev-avatar img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .dev-card h3{font-family:var(--font-display); font-size:18px; margin:0 0 4px;}
  .dev-card .role{font-size:12.5px; color:var(--gold); font-weight:600; margin-bottom:14px;}
  .dev-card .bio-box{
    text-align:left; background:var(--paper); border:1px solid var(--line);
    border-radius:12px; padding:12px; font-size:13px; margin-bottom:18px; color:var(--ink-soft);
  }
  .dev-card .bio-box p{margin:6px 0;}
  .dev-card .bio-box strong{color:var(--ink);}

  @media (prefers-reduced-motion:reduce){
    .sheet, .dev-modal{transition:none;}
  }
</style>
</head>
<body>

<div class="app-shell">
  <header class="top">
    <div>
      <div class="brand">Kh<span>a</span>ta</div>
      <div class="tagline">your money, plainly kept</div>
    </div>
  </header>

  <div id="content"></div>

  <button class="fab" id="fabAdd">+</button>

  <nav class="bottom">
    <button data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span>Home</span>
    </button>
    <button data-tab="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>History</span>
    </button>
    <button data-tab="accounts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>
      <span>Accounts</span>
    </button>
    <button data-tab="reports">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M12 19V5M20 19v-7"/></svg>
      <span>Reports</span>
    </button>
    <button data-tab="settings">

function driveConfigured(){
  return GOOGLE_CLIENT_ID && GOOGLE_CLIENT_ID.indexOf('PASTE_YOUR') !== 0;

function initDrive(){
  if(!driveConfigured()) return;
  if(typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2) return;
  driveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: (resp)=>{
      if(resp.error){ setSyncMsg('Sign-in failed. Please try again.'); return; }
      driveAccessToken = resp.access_token;
      if(drivePendingAction==='restore') driveRestoreNow();
      else driveBackupNow();
    }
  });
}
window.addEventListener('load', ()=> setTimeout(initDrive, 400));

function setSyncMsg(msg){
  const el = document.getElementById('syncMsg');
  if(el) el.textContent = msg;
}

async function driveFindFile(){
  const res = await fetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=' +
    encodeURIComponent("name='"+DRIVE_FILENAME+"'") + '&fields=files(id,name)', {
    headers:{Authorization:'Bearer '+driveAccessToken}
  });
  if(!res.ok) throw new Error('Could not reach Google Drive.');
  const data = await res.json();
  return (data.files && data.files[0]) || null;
}

async function driveBackupNow(){
  try{
    setSyncMsg('Backing up…');
    const file = await driveFindFile();
    const payload = JSON.stringify({
      transactions: state.transactions, categories: state.categories,
      sources: state.sources, accounts: state.accounts, recurring: state.recurring,
      debts: state.debts
    });
    const metadata = {name: DRIVE_FILENAME, mimeType:'application/json'};
    if(!file) metadata.parents = ['appDataFolder'];
    const boundary = 'khata_boundary_xyz';
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`+
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n${payload}\r\n`+
      `--${boundary}--`;
    const url = file
      ? `https://www.googleapis.com/upload/drive/v3/files/${file.id}?uploadType=multipart`
      : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
    const res = await fetch(url, {
      method: file ? 'PATCH' : 'POST',
      headers:{Authorization:'Bearer '+driveAccessToken, 'Content-Type':`multipart/related; boundary=${boundary}`},
      body
    });
    if(!res.ok) throw new Error('Upload failed');
    driveStatus.lastSync = new Date().toISOString();
    DB.set('driveStatus', driveStatus);
    setSyncMsg('Backed up just now ✓ (' + new Date().toLocaleTimeString() + ')');
  }catch(e){
    setSyncMsg('Backup failed. Check your connection and try again.');
  }
}

async function driveRestoreNow(){
  try{
    setSyncMsg('Checking Drive…');
    const file = await driveFindFile();
    if(!file){ setSyncMsg('No backup found on Drive yet.'); return; }
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`, {
      headers:{Authorization:'Bearer '+driveAccessToken}
    });
    if(!res.ok) throw new Error('Download failed');
    const data = await res.json();
    if(!confirm('This will replace everything on this device with your Drive backup. Continue?')){
      setSyncMsg(''); return;
    }
    state.transactions = data.transactions || [];
    state.categories = data.categories || DEFAULT_CATEGORIES.slice();
    state.sources = data.sources || DEFAULT_SOURCES.slice();
    state.accounts = data.accounts || DEFAULT_ACCOUNTS.slice();
    state.recurring = data.recurring || [];
    state.debts = data.debts || [];
    persist(false);
    setSyncMsg('Restored ✓');
    render();
  }catch(e){
    setSyncMsg('Restore failed. Check your connection and try again.');
  }
}

function fmt(n){
  n = Number(n)||0;
  const neg = n < 0;
  n = Math.abs(n);
  const s = n.toLocaleString('en-US', {maximumFractionDigits:0});
  return (neg?'-':'') + '৳' + s;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function totals(){
  let income=0, expense=0;
  state.transactions.forEach(t=>{
    if(t.type==='income') income += t.amount;
    else if(t.type==='expense') expense += t.amount;
  });
  return {income, expense, balance: income-expense};
}

function debtTotals(){
  let receivable = 0; // Paona (Lent to others)
  let payable = 0;    // Dena (Borrowed from others)

  state.debts.forEach(d=>{
    if(!d.settled){
      if(d.type === 'lend') receivable += d.amount;
      else if(d.type === 'borrow') payable += d.amount;
    }
  });
  return {receivable, payable, netReceivable: receivable - payable};
}

function accountBalances(){
  const bal = {};
  state.accounts.forEach(a=> bal[a]=0);
  
  // Transactions
  state.transactions.forEach(t=>{
    if(t.type==='income'){ bal[t.account] = (bal[t.account]||0) + t.amount; }
    else if(t.type==='expense'){ bal[t.account] = (bal[t.account]||0) - t.amount; }
    else if(t.type==='transfer'){
      bal[t.from] = (bal[t.from]||0) - t.amount;
      bal[t.to] = (bal[t.to]||0) + t.amount;
    }
    else if(t.type==='lend'){
      // Cash goes out as an asset receivable
      bal[t.account] = (bal[t.account]||0) - t.amount;
    }
    else if(t.type==='borrow'){
      // Cash comes in as a liability payable
      bal[t.account] = (bal[t.account]||0) + t.amount;
    }
    else if(t.type==='settle_lend'){
      // Cash collected back from debtor
      bal[t.account] = (bal[t.account]||0) + t.amount;
    }
    else if(t.type==='settle_borrow'){
      // Cash paid back to creditor
      bal[t.account] = (bal[t.account]||0) - t.amount;
    }
  });
  return bal;
}

function inRange(iso, period){
  const d = new Date(iso+'T00:00:00');
  const now = new Date();
  if(period==='week'){
    const start = new Date(now); start.setDate(now.getDate()-6); start.setHours(0,0,0,0);
    return d >= start && d <= now;
  }
  if(period==='month'){
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  }
  if(period==='year'){
    return d.getFullYear()===now.getFullYear();
  }
  return true;
}

function reportData(period){
  let income=0, expense=0;
  const catMap = {};
  state.transactions.forEach(t=>{
    if(!inRange(t.date, period)) return;
    if(t.type==='income') income += t.amount;
    else if(t.type==='expense'){
      expense += t.amount;
      catMap[t.category] = (catMap[t.category]||0) + t.amount;
    }
  });
  const cats = Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
  return {income, expense, remaining: income-expense, cats};
}

function sortedTransactions(){
  return state.transactions.slice().sort((a,b)=>{
    if(b.date !== a.date) return b.date.localeCompare(a.date);
    return (b.ts || 0) - (a.ts || 0);
  });
}

function txRow(t){
  let icon = '↓';
  let title = '';
  let sign = '';
  let sub = `${t.account || ''} · ${fmtDate(t.date)}` + (t.note? ' · '+escapeHtml(t.note): '');

  if(t.type === 'income'){
    icon = '↓'; title = t.source || 'Income'; sign = '+';
  } else if(t.type === 'expense'){
    icon = '↑'; title = t.category || 'Expense'; sign = '−';
  } else if(t.type === 'transfer'){
    icon = '⇄'; title = `${t.from} → ${t.to}`; sign = '';
    sub = fmtDate(t.date);
  } else if(t.type === 'lend'){
    icon = '🤝'; title = `Lent to ${t.person}`; sign = '−';
  } else if(t.type === 'borrow'){
    icon = '🤲'; title = `Borrowed from ${t.person}`; sign = '+';
  } else if(t.type === 'settle_lend'){
    icon = '✓'; title = `Received back from ${t.person}`; sign = '+';
  } else if(t.type === 'settle_borrow'){
    icon = '✓'; title = `Paid back to ${t.person}`; sign = '−';
  }

  return `<div class="tx ${t.type}">
    <div class="dot">${icon}</div>
    <div class="mid">
      <div class="t1">${escapeHtml(title)}</div>
      <div class="t2">${sub}</div>

}

function settleDebt(debtId){
  const d = state.debts.find(x => x.id === debtId);
  if(!d) return;

  const actionText = d.type === 'lend' 
    ? `Have you collected ${fmt(d.amount)} from ${d.person}? This will add the cash back into ${d.account}.`
    : `Have you paid back ${fmt(d.amount)} to ${d.person}? This will deduct the cash from ${d.account}.`;

  if(!confirm(actionText)) return;

  d.settled = true;
  d.settledDate = todayISO();

  // Create settlement transaction to correctly balance cash book
  state.transactions.push({
    id: uid(),
    type: d.type === 'lend' ? 'settle_lend' : 'settle_borrow',
    amount: d.amount,
    person: d.person,
    account: d.account,
    date: todayISO(),
    note: `Settled ${d.type === 'lend' ? 'Paona' : 'Dena'}`,
    ts: Date.now()
  });

  persist();
  render();
}

    });
  }
  return html;
}
function tabBtn(val,label){
  return `<button class="${state.reportPeriod===val?'active':''}" onclick="setPeriod('${val}')">${label}</button>`;
}
function setPeriod(p){ state.reportPeriod = p; render(); }

/* Accordion toggling */
function toggleAccordion(id){
  const el = document.getElementById(id);
  if(el){
    el.classList.toggle('active');
  }
}

function renderSettings(){
  let html = `
  <div style="display:flex; justify-content:space-between; align-items:center; margin-top:22px; margin-bottom:16px;">
    <h3 style="font-family:var(--font-display); font-size:18px; font-weight:600; margin:0;">Settings</h3>
    <button onclick="openDevModal()" style="background:var(--gold-soft); color:var(--gold); border:1px solid var(--gold); border-radius:20px; padding:6px 14px; font-size:12px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:5px;">
      <span>ℹ️</span> About Developer
    </button>
  </div>

  <div class="accordion-box" style="margin-bottom:14px;">
    <div class="manage-row" style="padding:14px 16px; border-bottom:none;">
      <div class="t1">Dark mode</div>
      <input type="checkbox" ${darkModeEnabled?'checked':''} onchange="toggleDarkMode(this.checked)">
    </div>
  </div>

  <!-- Categories Accordion -->
  <div class="accordion-box" id="accCategories">
    <div class="accordion-head" onclick="toggleAccordion('accCategories')">
      <h4>🏷️ Manage Categories</h4>
      <span class="arrow">▼</span>
    </div>
    <div class="accordion-body">
      <div style="font-size:12px; color:var(--ink-faint); margin:8px 0 10px;">Tap '×' to remove custom categories:</div>
      <div class="pill-list" id="catPills">
        ${state.categories.map(c=>`<div class="pill">${escapeHtml(c)} ${DEFAULT_CATEGORIES.includes(c)?'':`<span class="x" onclick="removeCategory('${escId(c)}')">×</span>`}</div>`).join('')}
      </div>
      <div class="row-inline">
        <input id="newCatInput" placeholder="New category name">
        <button class="btn primary small" onclick="addCategory()">Add</button>
      </div>
    </div>
  </div>

  <!-- Income Sources Accordion -->
  <div class="accordion-box" id="accSources">
    <div class="accordion-head" onclick="toggleAccordion('accSources')">
      <h4>💰 Income Sources</h4>
      <span class="arrow">▼</span>
    </div>
    <div class="accordion-body">
      <div style="font-size:12px; color:var(--ink-faint); margin:8px 0 10px;">Tap '×' to remove custom income sources:</div>
      <div class="pill-list" id="srcPills">
        ${state.sources.map(s=>`<div class="pill">${escapeHtml(s)} ${DEFAULT_SOURCES.includes(s)?'':`<span class="x" onclick="removeSource('${escId(s)}')">×</span>`}</div>`).join('')}
      </div>
      <div class="row-inline">
        <input id="newSrcInput" placeholder="New source name">
        <button class="btn primary small" onclick="addSource()">Add</button>
      </div>
    </div>
  </div>

  <!-- Payment Accounts Accordion -->
  <div class="accordion-box" id="accAccounts">
    <div class="accordion-head" onclick="toggleAccordion('accAccounts')">
      <h4>💳 Payment Accounts</h4>
      <span class="arrow">▼</span>
    </div>
    <div class="accordion-body">
      <div style="font-size:12px; color:var(--ink-faint); margin:8px 0 10px;">Tap '×' to remove accounts:</div>
      <div class="pill-list">
        ${state.accounts.map(a=>`<div class="pill">${escapeHtml(a)} ${DEFAULT_ACCOUNTS.includes(a)?'':`<span class="x" onclick="removeAccount('${escId(a)}')">×</span>`}</div>`).join('')}
      </div>
      <div class="row-inline">
        <input id="newAccInput" placeholder="New account name">
        <button class="btn primary small" onclick="addAccount()">Add</button>
      </div>
    </div>
  </div>

  <!-- Recurring Bills Accordion -->
  <div class="accordion-box" id="accRecurring">
    <div class="accordion-head" onclick="toggleAccordion('accRecurring')">
      <h4>🔄 Recurring Bills</h4>
      <span class="arrow">▼</span>
    </div>
    <div class="accordion-body">
      ${state.recurring.length ? state.recurring.map(r=>`
        <div class="manage-row">
          <div><div class="t1">${escapeHtml(r.name)}</div><div class="t2">${fmt(r.amount)} from ${escapeHtml(r.account)} · day ${r.day}</div></div>
          <span class="x" onclick="removeRecurring('${r.id}')">Remove</span>
        </div>
      `).join('') : `<div style="font-size:13px; color:var(--ink-faint); padding:10px 0;">No recurring bills set yet.</div>`}

      <div style="margin-top:14px; border-top:1px dashed var(--line); padding-top:12px;">
        <label class="field"><span class="fl">Bill name</span><input id="recName" placeholder="e.g. WiFi bill"></label>
        <label class="field"><span class="fl">Amount</span>
          <div class="amount-input"><span class="sym">৳</span><input id="recAmount" type="number" inputmode="decimal" placeholder="0"></div>
        </label>
        <label class="field"><span class="fl">Account</span><select id="recAccount">${state.accounts.map(a=>`<option>${escapeHtml(a)}</option>`).join('')}</select></label>
        <label class="field"><span class="fl">Remind on day of month</span><input id="recDay" type="number" min="1" max="31" placeholder="1–31"></label>
        <button class="btn primary small" style="width:100%;" onclick="addRecurring()">Add recurring bill</button>
      </div>
    </div>
  </div>

  <!-- Google Drive Backup Accordion -->
  <div class="accordion-box" id="accDrive">
    <div class="accordion-head" onclick="toggleAccordion('accDrive')">
      <h4>☁️ Google Drive Backup</h4>
      <span class="arrow">▼</span>
    </div>
    <div class="accordion-body">
      <div class="manage-row" style="border-bottom:none; padding:10px 0 6px;">
        <div>
          <div class="t1">Sync status</div>
          <div class="t2" id="syncMsg">${driveStatus.lastSync ? 'Last synced '+new Date(driveStatus.lastSync).toLocaleString() : (driveConfigured() ? 'Not connected yet' : 'Not set up yet')}</div>
        </div>
      </div>
      <div style="display:flex; gap:8px; margin:8px 0 12px;">
        <button class="btn primary small" style="flex:1;" onclick="driveConnectClick()">Backup now</button>
        <button class="btn small" style="flex:1; border:1px solid var(--line); background:var(--paper-raised);" onclick="driveRestoreClick()">Restore</button>
      </div>
      <div class="manage-row" style="border-bottom:none; padding:8px 0;">
        <div class="t1">Auto-backup while app is open</div>
        <input type="checkbox" ${driveAutoSync?'checked':''} onchange="toggleAutoSync(this.checked)">
      </div>
    </div>
  </div>

  <div class="sec-head" style="margin-top:20px;"><h3>Your data</h3></div>
  <div class="manage-row"><div class="t1">Export as JSON file</div><a onclick="exportData()" style="font-size:13px;font-weight:600;">Download</a></div>
  <div class="manage-row"><div class="t1">Erase everything</div><a onclick="eraseAll()" style="font-size:13px;font-weight:600;color:var(--rust);">Erase</a></div>
  <div style="height:20px;"></div>`;

  return html;
}
function escId(s){ return String(s).replace(/'/g,"\\'"); }

function addCategory(){
  const el = document.getElementById('newCatInput');
  const v = el.value.trim();
  if(!v) return;
  if(!state.categories.includes(v)) state.categories.push(v);
  persist(); render();
}
function removeCategory(c){ state.categories = state.categories.filter(x=>x!==c); persist(); render(); }

function addSource(){
  const el = document.getElementById('newSrcInput');
  const v = el.value.trim();
  if(!v) return;
  if(!state.sources.includes(v)) state.sources.push(v);
  persist(); render();
}
function removeSource(s){ state.sources = state.sources.filter(x=>x!==s); persist(); render(); }

function addAccount(){
  const el = document.getElementById('newAccInput');
  const v = el.value.trim();
  if(!v) return;
  if(!state.accounts.includes(v)) state.accounts.push(v);
  persist(); render();
}
function removeAccount(a){ state.accounts = state.accounts.filter(x=>x!==a); persist(); render(); }

function addRecurring(){
  const name = document.getElementById('recName').value.trim();
  const amount = parseFloat(document.getElementById('recAmount').value);
  const account = document.getElementById('recAccount').value;
  const day = parseInt(document.getElementById('recDay').value);
  if(!name || !amount || amount<=0 || !day || day<1 || day>31){
    alert('Please fill in a bill name, a valid amount, and a day between 1 and 31.');
    return;
  }
  state.recurring.push({id:uid(), name, amount, account, day});
  persist(); render();
}
function removeRecurring(id){ state.recurring = state.recurring.filter(r=>r.id!==id); persist(); render(); }

function exportData(){
  const blob = new Blob([JSON.stringify({
    transactions: state.transactions, categories: state.categories,
    sources: state.sources, accounts: state.accounts, recurring: state.recurring,
    debts: state.debts
  }, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'khata-backup.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function eraseAll(){
  if(!confirm('This will permanently delete all records including transactions, accounts, receivables and payables. Continue?')) return;
  state.transactions = []; state.categories = DEFAULT_CATEGORIES.slice();
  state.sources = DEFAULT_SOURCES.slice(); state.accounts = DEFAULT_ACCOUNTS.slice();
  state.recurring = []; state.debts = [];
  persist(); render();
}

function goTab(t){ state.tab = t; render(); }

function render(){
  const content = document.getElementById('content');
  if(state.tab==='home') content.innerHTML = renderHome();
  else if(state.tab==='history') content.innerHTML = renderHistory();
  else if(state.tab==='accounts') content.innerHTML = renderAccounts();
  else if(state.tab==='reports') content.innerHTML = renderReports();
  else if(state.tab==='settings') content.innerHTML = renderSettings();

  document.querySelectorAll('nav.bottom button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab===state.tab);
  });
  content.scrollTop = 0;
}

document.querySelectorAll('nav.bottom button').forEach(b=>{
  b.addEventListener('click', ()=> goTab(b.dataset.tab));
});

let addType = 'expense';

function openAdd(type){
  addType = type || 'expense';
  document.getElementById('sheetOverlay').classList.add('show');
  renderSheet();
}
function closeSheet(){
  document.getElementById('sheetOverlay').classList.remove('show');
}
document.getElementById('fabAdd').addEventListener('click', ()=> openAdd('expense'));
document.getElementById('sheetOverlay').addEventListener('click', (e)=>{
  if(e.target.id==='sheetOverlay') closeSheet();
});

function setAddType(t){ addType = t; renderSheet(); }

function renderSheet(){
  const body = document.getElementById('sheetBody');
  const catOptions = state.categories.map(c=>`<option>${escapeHtml(c)}</option>`).join('');
  const srcOptions = state.sources.map(c=>`<option>${escapeHtml(c)}</option>`).join('');
  const accOptions = state.accounts.map(c=>`<option>${escapeHtml(c)}</option>`).join('');

  let fields = '';
  if(addType==='income'){
    fields = `
      <label class="field"><span class="fl">Amount</span>
        <div class="amount-input"><span class="sym">৳</span><input id="fAmount" type="number" inputmode="decimal" placeholder="0" autofocus></div>
      </label>
      <label class="field"><span class="fl">Date</span><input id="fDate" type="date" value="${todayISO()}"></label>
      <label class="field"><span class="fl">Source</span><select id="fSource">${srcOptions}</select></label>
      <label class="field"><span class="fl">Account</span><select id="fAccount">${accOptions}</select></label>
      <label class="field"><span class="fl">Note (optional)</span><input id="fNote" placeholder="e.g. Monthly allowance"></label>
    `;
  } else if(addType==='expense'){
    fields = `
      <label class="field"><span class="fl">Amount</span>
        <div class="amount-input"><span class="sym">৳</span><input id="fAmount" type="number" inputmode="decimal" placeholder="0" autofocus></div>
      </label>
      <label class="field"><span class="fl">Date</span><input id="fDate" type="date" value="${todayISO()}"></label>
      <label class="field"><span class="fl">Category</span><select id="fCategory">${catOptions}</select></label>
      <label class="field"><span class="fl">Account</span><select id="fAccount">${accOptions}</select></label>
      <label class="field"><span class="fl">Note (optional)</span><input id="fNote" placeholder="e.g. Lunch"></label>
    `;
  } else if(addType==='transfer'){
    fields = `
      <label class="field"><span class="fl">Amount</span>
        <div class="amount-input"><span class="sym">৳</span><input id="fAmount" type="number" inputmode="decimal" placeholder="0" autofocus></div>
      </label>
      <label class="field"><span class="fl">Date</span><input id="fDate" type="date" value="${todayISO()}"></label>
      <label class="field"><span class="fl">From account</span><select id="fFrom">${accOptions}</select></label>
      <label class="field"><span class="fl">To account</span><select id="fTo">${accOptions}</select></label>
      <label class="field"><span class="fl">Note (optional)</span><input id="fNote" placeholder="e.g. Moving to bank"></label>
    `;
  } else if(addType==='lend'){
    fields = `
      <label class="field"><span class="fl">Lent Amount (Receivable)</span>
        <div class="amount-input"><span class="sym">৳</span><input id="fAmount" type="number" inputmode="decimal" placeholder="0" autofocus></div>
      </label>
      <label class="field"><span class="fl">Who owes you? (Person name)</span><input id="fPerson" placeholder="e.g. Shakil"></label>
      <label class="field"><span class="fl">Date</span><input id="fDate" type="date" value="${todayISO()}"></label>
      <label class="field"><span class="fl">Paid from Account</span><select id="fAccount">${accOptions}</select></label>
      <label class="field"><span class="fl">Note (optional)</span><input id="fNote" placeholder="e.g. Lunch bill dhar nilo"></label>
    `;
  } else if(addType==='borrow'){
    fields = `
      <label class="field"><span class="fl">Borrowed Amount (Payable)</span>
        <div class="amount-input"><span class="sym">৳</span><input id="fAmount" type="number" inputmode="decimal" placeholder="0" autofocus></div>
      </label>
      <label class="field"><span class="fl">Who did you borrow from? (Person name)</span><input id="fPerson" placeholder="e.g. Tanvir"></label>
      <label class="field"><span class="fl">Date</span><input id="fDate" type="date" value="${todayISO()}"></label>
      <label class="field"><span class="fl">Received into Account</span><select id="fAccount">${accOptions}</select></label>
      <label class="field"><span class="fl">Note (optional)</span><input id="fNote" placeholder="e.g. Hostel rent dhar"></label>
    `;
  }

  body.innerHTML = `
    <div class="handle"></div>
    <h2>${addType==='income'?'Add income':addType==='expense'?'Add expense':addType==='transfer'?'Transfer':addType==='lend'?'Lend Money (Paona)': 'Borrow Money (Dena)'}</h2>
    <div class="segmented">
      <button class="${addType==='income'?'active':''}" onclick="setAddType('income')">Income</button>
      <button class="${addType==='expense'?'active':''}" onclick="setAddType('expense')">Expense</button>
      <button class="${addType==='transfer'?'active':''}" onclick="setAddType('transfer')">Transfer</button>
      <button class="${addType==='lend'?'active':''}" onclick="setAddType('lend')">Lend</button>
      <button class="${addType==='borrow'?'active':''}" onclick="setAddType('borrow')">Borrow</button>
    </div>
    <div class="err-msg" id="errMsg"></div>
    ${fields}
    <button class="btn primary" onclick="saveTransaction()">Save</button>
    <button class="btn ghost" onclick="closeSheet()">Cancel</button>
  `;
}

function showErr(msg){
  const el = document.getElementById('errMsg');
  el.textContent = msg;
  el.style.display = 'block';
}

function saveTransaction(){
  const amountEl = document.getElementById('fAmount');
  const amount = parseFloat(amountEl.value);
  const dateEl = document.getElementById('fDate');
  const date = (dateEl && dateEl.value) ? dateEl.value : todayISO();
  const note = document.getElementById('fNote').value.trim();
  const ts = Date.now();

  if(!amount || amount <= 0){
    showErr('Please enter a valid amount greater than zero.');
    return;
  }

  if(addType==='income'){
    const source = document.getElementById('fSource').value;
    const account = document.getElementById('fAccount').value;
    state.transactions.push({id:uid(), type:'income', amount, source, account, note, date, ts});
  } else if(addType==='expense'){
    const category = document.getElementById('fCategory').value;
    const account = document.getElementById('fAccount').value;
    state.transactions.push({id:uid(), type:'expense', amount, category, account, note, date, ts});
  } else if(addType==='transfer'){
    const from = document.getElementById('fFrom').value;
    const to = document.getElementById('fTo').value;
    if(from === to){
      showErr('From and to accounts must be different.');
      return;
    }
    state.transactions.push({id:uid(), type:'transfer', amount, from, to, note, date, ts});
  } else if(addType==='lend' || addType==='borrow'){
    const person = document.getElementById('fPerson').value.trim();
    const account = document.getElementById('fAccount').value;
    if(!person){
      showErr('Please enter the person\'s name.');
      return;
    }
    const debtId = uid();
    // Add to active debts
    state.debts.push({
      id: debtId,
      type: addType,
      person,
      amount,
      account,
      date,
      note,
      settled: false
    });
    // Add transaction
    state.transactions.push({
      id: uid(),
      type: addType,
      debtId,
      amount,
      person,
      account,
      note,
      date,
      ts
    });
  }

  persist();
  closeSheet();
  render();
}

render();
</script>

  });

  window.addEventListener('online', () => {
    console.log('Back online. Triggering auto-sync...');
    if (typeof driveBackupNow === 'function' && driveAccessToken) {
      driveBackupNow();
    }
  });
}
</script>
