name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Prepare www folder
        run: |
          mkdir -p www
          rsync -a --exclude='.git' --exclude='.github' --exclude='www' \
            --exclude='config.xml' --exclude='package.json' --exclude='package-lock.json' \
            --exclude='.gitignore' --exclude='.monacaignore' --exclude='.nojekyll' \
            --exclude='LICENSE' --exclude='build.json' --exclude='node_modules' \
            ./ www/
          echo "www folder now contains:"
          ls -la www

      - name: Add Android platform
        run: cordova platform add android

      - name: Add plugins
        run: cordova plugin add cordova-plugin-googleplus

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Create signing config
        run: |
          cat > build-release.json << EOF
          {
            "android": {
              "release": {
                "keystore": "release.keystore",
                "storePassword": "${{ secrets.KEYSTORE_PASSWORD }}",
                "alias": "${{ secrets.KEY_ALIAS }}",
                "password": "${{ secrets.KEY_PASSWORD }}"
              }
            }
          }
          EOF

      - name: Build release APK
        run: cordova build android --release --buildConfig=build-release.json -- --packageType=apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: khata-release-apk
          path: platforms/android/app/build/outputs/apk/release/*.apk
